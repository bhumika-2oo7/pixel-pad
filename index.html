<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Pad</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e9e4f5;
    --ink: #2d1b4e;
    --panel: #f8f5ff;
    --accent: #ff6b8b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Silkscreen", "Courier New", monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
  }
  h1 { font-size: 2rem; margin: 0 0 4px; letter-spacing: 1px; }
  p.sub { margin: 0 0 20px; font-size: .8rem; opacity: .75; text-align: center; }
  .app {
    background: var(--panel);
    border: 3px solid var(--ink);
    box-shadow: 6px 6px 0 var(--ink);
    padding: 16px;
    max-width: 100%;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(16, 1fr);
    width: min(80vw, 420px);
    aspect-ratio: 1;
    border: 2px solid var(--ink);
    background: #fff;
    touch-action: none;
    user-select: none;
  }
  .cell { border: 1px solid rgba(45, 27, 78, .12); }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
  .swatch {
    width: 30px; height: 30px;
    border: 2px solid var(--ink);
    cursor: pointer;
    padding: 0;
  }
