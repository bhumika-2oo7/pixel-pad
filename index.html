<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Pad</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e9e4f5;
    --ink: #2d1b4e;
    --panel: #f8f5ff;
    --accent: #ff6b8b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Silkscreen", "Courier New", monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
  }
  h1 { font-size: 2rem; margin: 0 0 4px; letter-spacing: 1px; }
  p.sub { margin: 0 0 20px; font-size: .8rem; opacity: .75; text-align: center; }
  .app {
    background: var(--panel);
    border: 3px solid var(--ink);
    box-shadow: 6px 6px 0 var(--ink);
    padding: 16px;
    max-width: 100%;
  }


  #grid {
    display: grid;
    grid-template-columns: repeat(16, 1fr);
    width: min(80vw, 420px);
    aspect-ratio: 1;
    border: 2px solid var(--ink);
    background: #fff;
    touch-action: none;
    user-select: none;
  }

  .cell { border: 1px solid rgba(45, 27, 78, .12); }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
  .swatch {
    width: 30px; height: 30px;
    border: 2px solid var(--ink);
    cursor: pointer;
    padding: 0;
  }
  .swatch.active { outline: 3px solid var(--accent); outline-offset: 2px; }
  input[type=color] { width: 36px; height: 34px; border: 2px solid var(--ink); padding: 0; background: none; cursor: pointer; }
  button.act {
    font-family: inherit;
    font-size: .8rem;
    background: var(--ink);
    color: var(--panel);
    border: none;
    padding: 9px 12px;
    cursor: pointer;
  }
  button.act:hover { background: var(--accent); color: var(--ink); }
  button.act:focus-visible, .swatch:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  .status{
    display: flex;
    justify-content: space-between;
    margin-top: 12px;
    font-size: .7rem;
    opacity: .8;

  }
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50;
    transform: translateX(-50%);
    background: var(--ink);
    color:var(--panel);
    padding: 10px 16px;
    font-size: .75rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity.2s;

  }
  #toast.show{ opacity: 1;}

  .help{
    margin-top: 18px;
    font-size: .65rem;
    opacity: .6;
    text-align: center;
    max-width: 420px;
    line-height: 1.6;

  }
  @media(prefers-reduced-motion: reduce) {
    #toast { transition: none;}

  }

</style>
</head>
<body>
  <h1>Pixel Pad</h1>
  <p class="sub">Click or drag to paint. Save your art as a PNG.</p>

  <div class="app">
    <div id="grid" aria-label="Pixel canvas"></div>

    <div class="tools" id="palette"></div>

    <div class="row">
      <label for="custom" style="display:flex;align-items:center;gap:8px;font-size:.8rem;">
        Custom <input type="color" id="custom" value="#ff6b8b">
      </label>
      <button class="act" id="eraser">Eraser</button>
      <button class="act" id="fill">Fill</button>
      <button class="act" id="clear">Clear</button>
      <button class="act" id="save">Save PNG</button>
    </div>
    <!-- NEW: history, view options, and browser storage-->
    <div class="row">
      <button class="act" id="eraser">Eraser</button>
      <button class="act" id="fill">Fill</button>
      <button class="act" id="clear">Clear</button>
      <button class="act" id="save">Save PNG</button>
    </div>
    
    <!-- NEW: history, view options ,and browser storage -->
    <div class="row">
      <button class="act" id-"undo" disabled>Undo</button>
      <button class="act" id="redo" disabled>Redo</button>
      <button class="act" id="lines">Grid Lines</button>
      <button class="act" id="mirror">Mirror</button>
    </div>

    <div class="row">
      <button class="act" id="store">Save draft</button>
      <button class="act" id="load">Load draft</button>

    </div>

    </div class="status">
      <span id="count">Pixels: 0</span>
      <span id="modeLabel">Mode: paint</span>
    </div>
  </div>

  <p class=""help">
  Shortcuts: B brush, E eraser, F fill, M mirror , G grid lines,
  Ctrl+z undo, Ctrl+Y redo.

</p>

<div id="toast" role="status"></div>

<script>
  const SIZE = 16;
  const COLORS = ["#2d1b4e", "#ff6b8b", "#ffb86b", "#ffe66b", "#6be5a0", "#6bb8ff", "#a06bff", "#ffffff"];
  const STORAGE_KEY =pixel-pad-draft;
  const MAX_HISTORY = 50;
  const grid = document.getElementById("grid");
  const palette = document.getElementById("palette");
  const custom = document.getElementById("custom");
  const undoBtn = document.getElementById("undo");
  const redoBtn = document.getElementById("redo");
  const fillBtn = document.getElementById("fill");
  const linesBtn = document.getElementById("lines");
  const mirrorBtn = document.getElementById("mirror");
  const countLabel = document.getElementById("count");
  const modeLabel = document.getElementById("modeLabel");
  const toast = document.getElementById("toast");

  let current = COLORS[0];
  let painting = false;
  let fillmode = false;
  let mirrorMode = false;
  let toastTimer = null; 

  let undoStack=[];
  let redoStack=[];

  const cells = [];
  for (let i = 0; i < SIZE * SIZE; i++) {
    const c = document.createElement("div");
    c.className = "cell";
    c.dataset.index = i;
    grid.appendChild(c);
    cells.push(c);
  }

  COLORS.forEach((color, i) => {
    const b = document.createElement("button");
    b.className = "swatch" + (i === 0 ? " active" : "");
    b.style.background = color;
    b.setAttribute("aria-label", "Color " + color);
    b.onclick = () => setColor(color, b);
    palette.appendChild(b);
  });

  function setColor(color, el) {
    current = color;
    fillMode= false;
    document.querySelectorAll(".swatch").forEach(s => s.classList.remove("active"));
    if (el) el.classList.add("active");
    updateStatus();
  }

  function normalize(color)
  {
    const probe = document.createElement("div");
    probe.style.background = color;
    return probe.style.background;
  }
  
  function showToast(message){
    toast.textContext = message;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove("show"), 1400);

    }
  function updateStatus(){
    const filled = cells.filter(c => c.style.background).length;
    countLabel.textContent = "Pixels:"+filled;


    let label = "paint";
    if (current === "erase") label ="erase";
    if (fillMode) label = "fill";
    if (mirrorMode) label += " + mirror";
    modeLabel.textContent ="Mode: "+ label;
    fillBtn.classList.toggle("on", fillMode);
    mirrorBtn.classList.toggle("on", mirrorMode);
    document.getElementById("eraser").classList.toggle("on", current === "eraser");

    undoBtn.disabled=undoStack.length === 0;
    redoBtn.disabled=redostack.length ===0;

  }

  function snapshot(){
    return cells.map(c => c.style.background);
  }

  function restore(state){
    cells.forEach((c,i) => c.style.background = state[i]);
  }

  function saveHistory(){
    undoStack.push(snapshot())
      undoStack.push(snapshot());
      if (undoStack.length> MAX_HISTORY) undoStack.shift();
      redoStack=[];
      updateStatus

  function redo(){
    if (redoStack.length===0) return;
    undoStack.push(snapshot());
    restore(redoStack.pop());
    updateStatus();
  }

  // PAINTING

  function colorCell(cell){
    cell.style.background = current === "erase" ? "" : current;

  }

  function mirrorOf(cell){
    const i =Number(cell.dataset.index);
    const row = Math.floor(i/SIZE);
    const col =i% SIZE;
    return cells[row*SIZE+(SIZE-1- col)];

  }

  function paint(e) {

    if(startColor === newColor)return;

    const stack =[Number(startCell.dataset.index)];
    const seen = new Set();

    while (stack.length){
      const i = stack.pop();
      if (seen.has(i)) continue;
      seen.add(i);

      const cell = cells[i];
      if(cell.style.background !== startColor) continue;

      cell.style.background = newColor;

      const row = Math.floor(i/SIZE)

      if (row>0) stack.push(i -SIZE);
      if (row < SIZE -1) stack.push(i-1);
      if (col>0) stack.push(i-1);
      if (col<SIZE-1) stack.push(i+1);

  grid.addEventListener("pointermove",e =>{
    const target = document.elementFromPoint(e.clientX, e.clientY);
    if (!target || !target.classList.contains("cell")) return;

    saveHistory();

    if (fillMode){
      floodFill(target);
      updateStatus();
      return;

    }

    painting = true;
    paint(e);
  
  });
  grid.addEventListener("pointermove", e => { if (painting) paint(e); });
  window.addEventListener("pointerup", () => painting = false);

  // BUTTONS

  custom.addEventListener("input", () => setColor(custom.value, null));
  document.getElementById("eraser").onclick = () => setColor("erase", null);

  fillBtn.onclick = () =>{
    fillMode= !fillMode;
    updateStatus();

  };

  mirrorBtn.onclick =() => {
    mirrorMode =!mirrorMode;
    updateStatus();
  };

  linesBtn.onclick=() => {
    grid.classList.toggle("no-lines");
  };
 


  document.getElementById("clear").onclick = () => {
    saveHistory();
    cells.forEach(c => c.style.background = "");
    updateStatus();
  };
  undoBtn.onclick = undo;
  redoBtn.onclick = redo;








</script>
</body>
</html>
