<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pixel Pad</title>
<link href="https://fonts.googleapis.com/css2?family=Silkscreen:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e9e4f5;
    --ink: #2d1b4e;
    --panel: #f8f5ff;
    --accent: #ff6b8b;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--ink);
    font-family: "Silkscreen", "Courier New", monospace;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 24px 16px 40px;
  }
  h1 { font-size: 2rem; margin: 0 0 4px; letter-spacing: 1px; }
  p.sub { margin: 0 0 20px; font-size: .8rem; opacity: .75; text-align: center; }
  .app {
    background: var(--panel);
    border: 3px solid var(--ink);
    box-shadow: 6px 6px 0 var(--ink);
    padding: 16px;
    max-width: 100%;
  }
  #grid {
    display: grid;
    grid-template-columns: repeat(16, 1fr);
    width: min(80vw, 420px);
    aspect-ratio: 1;
    border: 2px solid var(--ink);
    background: #fff;
    touch-action: none;
    user-select: none;
  }
  .cell { border: 1px solid rgba(45, 27, 78, .12); }
  .tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; align-items: center; }
  .swatch {
    width: 30px; height: 30px;
    border: 2px solid var(--ink);
    cursor: pointer;
    padding: 0;
  }
  .swatch.active { outline: 3px solid var(--accent); outline-offset: 2px; }
  input[type=color] { width: 36px; height: 34px; border: 2px solid var(--ink); padding: 0; background: none; cursor: pointer; }
  button.act {
    font-family: inherit;
    font-size: .8rem;
    background: var(--ink);
    color: var(--panel);
    border: none;
    padding: 9px 12px;
    cursor: pointer;
  }
  button.act:hover { background: var(--accent); color: var(--ink); }
  button.act:focus-visible, .swatch:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
</style>
</head>
<body>
  <h1>Pixel Pad</h1>
  <p class="sub">Click or drag to paint. Save your art as a PNG.</p>

  <div class="app">
    <div id="grid" aria-label="Pixel canvas"></div>

    <div class="tools" id="palette"></div>

    <div class="row">
      <label for="custom" style="display:flex;align-items:center;gap:8px;font-size:.8rem;">
        Custom <input type="color" id="custom" value="#ff6b8b">
      </label>
      <button class="act" id="eraser">Eraser</button>
      <button class="act" id="clear">Clear</button>
      <button class="act" id="save">Save PNG</button>
    </div>
  </div>
<script>
  const SIZE = 16;
  const COLORS = ["#2d1b4e", "#ff6b8b", "#ffb86b", "#ffe66b", "#6be5a0", "#6bb8ff", "#a06bff", "#ffffff"];
  const grid = document.getElementById("grid");
  const palette = document.getElementById("palette");
  const custom = document.getElementById("custom");

  let current = COLORS[0];
  let painting = false;
  const cells = [];
  for (let i = 0; i < SIZE * SIZE; i++) {
    const c = document.createElement("div");
    c.className = "cell";
    c.dataset.index = i;
    grid.appendChild(c);
    cells.push(c);
  }

  COLORS.forEach((color, i) => {
    const b = document.createElement("button");
    b.className = "swatch" + (i === 0 ? " active" : "");
    b.style.background = color;
    b.setAttribute("aria-label", "Color " + color);
    b.onclick = () => setColor(color, b);
    palette.appendChild(b);
  });

  function setColor(color, el) {
    current = color;
    document.querySelectorAll(".swatch").forEach(s => s.classList.remove("active"));
    if (el) el.classList.add("active");
  }

  function paint(e) {
    const target = document.elementFromPoint(e.clientX, e.clientY);
    if (target && target.classList.contains("cell")) {
      target.style.background = current === "erase" ? "" : current;
    }
  }

  grid.addEventListener("pointerdown", e => { painting = true; paint(e); });
  grid.addEventListener("pointermove", e => { if (painting) paint(e); });
  window.addEventListener("pointerup", () => painting = false);

  custom.addEventListener("input", () => setColor(custom.value, null));
  document.getElementById("eraser").onclick = () => setColor("erase", null);
  document.getElementById("clear").onclick = () => cells.forEach(c => c.style.background = "");
  document.getElementById("save").onclick = () => {
    const scale = 20;
    const canvas = document.createElement("canvas");
    canvas.width = canvas.height = SIZE * scale;
    const ctx = canvas.getContext("2d");
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    cells.forEach((c, i) => {
      if (c.style.background) {
        ctx.fillStyle = c.style.background;
        ctx.fillRect((i % SIZE) * scale, Math.floor(i / SIZE) * scale, scale, scale);
      }
    });
    const a = document.createElement("a");
    a.download = "my-pixel-art.png";
    a.href = canvas.toDataURL("image/png");
    a.click();
  };
</script>
</body>
</html>
